<h1 class="title">Library of Babel (The Org Manual)</h1>
<p>
Babel is Org mode's system for executing code and using the results.
It is documented under <a href="docs/Working-with-Source-Code.html">Working
with Source Code</a>, and its results can be pulled into documents via
<a href="docs/Exporting.html">Exporting</a>.
</p>
<h2 id="Structure-of-Code-Blocks">Structure of Code Blocks</h2>
<pre class="src src-emacs-lisp">
(<span class="myc-kw">let</span> ((x 42))
  (<span class="myc-kw">message</span> <span class="myc-str">"from the library"</span> x))
</pre>
